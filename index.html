nt-family: 'IBM Plex Sans';\n  font-style: normal;\n  font-weight: 500;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"f1d8b439-fb15-44e4-b451-3f71e572529e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Sans';\n  font-style: normal;\n  font-weight: 500;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"62d03cd4-0f48-49ce-8e08-7ee8094e124a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'IBM Plex Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"d1d223a0-69d3-409b-8b80-5219e67f14a5\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'IBM Plex Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"d08f5d4a-2669-464c-aad0-b592aa4fbc2f\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'IBM Plex Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"07c58321-e52c-4835-bfce-0906550d2c47\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'IBM Plex Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"7ea723a6-629e-4920-afaf-3d403557edf9\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'IBM Plex Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"f1d8b439-fb15-44e4-b451-3f71e572529e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"62d03cd4-0f48-49ce-8e08-7ee8094e124a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: var(--color-bg);\n    -webkit-user-select: none; -moz-user-select: none; user-select: none;\n    -webkit-touch-callout: none; }\n  a { -webkit-user-select: none; user-select: none; }\n  ::selection { background: transparent; }\n  a { color: var(--color-accent-700); text-decoration: none; border-bottom: 1px solid var(--color-accent-300); }\n  a:hover { color: var(--color-accent-600); border-bottom-color: var(--color-accent-600); }\n  a:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background: var(--color-bg); color: var(--color-text); font-family: 'IBM Plex Sans', sans-serif; -webkit-font-smoothing: antialiased;\">\n\n  <div style=\"max-width: 760px; margin: 0 auto; padding: 28px 22px 0;\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 14px 24px; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-neutral-700);\">\n      <span style=\"color: var(--color-text); font-weight: 600;\">Longrich · Россия · Первая волна<\u002Fspan>\n      <span style=\"color: var(--color-accent-700);\">Для опытных сетевиков<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width: 760px; margin: 0 auto; padding: 72px 22px 0;\">\n    <h1 style=\"margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: clamp(34px, 8.4vw, 66px); line-height: 1.02; letter-spacing: -0.02em; text-wrap: balance;\">ТЫ УМЕЕШЬ СТРОИТЬ СЕТЬ.<br>НО ВЫДЕРЖИТ ЛИ ОНА <span style=\"color: var(--color-accent-2)\">НЕДЕЛЮ БЕЗ ТЕБЯ?<\u002Fspan><\u002Fh1>\n    <p style=\"margin: 40px 0 0; font-family: var(--font-heading); font-style: italic; font-size: clamp(22px, 4vw, 30px); line-height: 1.2; color: var(--color-accent-700);\">Проверим?<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"max-width: 760px; margin: 0 auto; padding: 0 22px;\">\n\n    <section style=\"display: flex; flex-direction: column; gap: 18px; padding: 56px 0 0; font-size: clamp(17px, 2.3vw, 19px); line-height: 1.6;\">\n      <p style=\"margin: 0;\">Если ты завтра на неделю исчезнешь из Telegram.<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n        <p style=\"margin: 0;\">Не будешь писать.<\u002Fp>\n        <p style=\"margin: 0;\">Не будешь звонить.<\u002Fp>\n        <p style=\"margin: 0;\">Не проведёшь ни одного созвона.<\u002Fp>\n        <p style=\"margin: 0;\">Не напомнишь про план.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 0;\">Не спросишь:<\u002Fp>\n      <p style=\"margin: 0; font-family: var(--font-heading); font-style: italic; font-size: 1.15em; color: var(--color-neutral-800);\">«Ну что, ты сегодня сделал?»<\u002Fp>\n      <p style=\"margin: 8px 0 0; font-weight: 600;\">Что произойдёт?<\u002Fp>\n      <p style=\"margin: 0;\">Команда продолжит делать то же самое?<\u002Fp>\n      <p style=\"margin: 0;\">Или через несколько дней начнётся:<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 6px 0 0 20px; border-left: 2px solid var(--color-accent-200); font-family: var(--font-heading); font-style: italic; font-size: 1.1em; color: var(--color-neutral-800);\">\n        <p style=\"margin: 0;\">«А что сейчас продвигаем?»<\u002Fp>\n        <p style=\"margin: 0;\">«А что говорить людям?»<\u002Fp>\n        <p style=\"margin: 0;\">«А есть какой-нибудь материал?»<\u002Fp>\n        <p style=\"margin: 0;\">«А ты можешь объяснить?»<\u002Fp>\n        <p style=\"margin: 0;\">«А когда следующий созвон?»<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 8px 0 0;\">А кто-то просто перестанет что-либо делать.<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n        <p style=\"margin: 0;\">Тихо.<\u002Fp>\n        <p style=\"margin: 0;\">Без конфликта.<\u002Fp>\n        <p style=\"margin: 0;\">Просто исчезнет.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display: flex; flex-direction: column; gap: 18px; padding: 84px 0 0; font-size: clamp(17px, 2.3vw, 19px); line-height: 1.6;\">\n      <p style=\"margin: 0;\">И вот здесь есть неприятная вещь, о которой в сетевом бизнесе почему-то мало говорят.<\u002Fp>\n      <h2 style=\"margin: 30px 0 10px; font-family: var(--font-heading); font-weight: 700; font-size: clamp(28px, 5.6vw, 46px); line-height: 1.06; letter-spacing: -0.015em; text-wrap: balance;\">ЧЕМ СИЛЬНЕЕ ЛИДЕР, ТЕМ ЛЕГЧЕ ЕМУ ПОСТРОИТЬ КОМАНДУ, КОТОРАЯ <span style=\"color: var(--color-accent-2)\">БЕЗ НЕГО<\u002Fspan> НЕ РАБОТАЕТ.<\u002Fh2>\n      <p style=\"margin: 0; font-family: var(--font-heading); font-style: italic; font-size: 1.25em; color: var(--color-accent-2-700);\">Парадокс.<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n        <p style=\"margin: 0;\">Ты умеешь приглашать — поэтому приглашаешь сам.<\u002Fp>\n        <p style=\"margin: 0;\">Умеешь объяснять — поэтому объясняешь сам.<\u002Fp>\n        <p style=\"margin: 0;\">Умеешь продавать — поэтому продаёшь сам.<\u002Fp>\n        <p style=\"margin: 0;\">Умеешь мотивировать — поэтому мотивируешь сам.<\u002Fp>\n        <p style=\"margin: 0;\">Умеешь разруливать — поэтому разруливаешь сам.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 8px 0 0;\">И постепенно происходит незаметная подмена.<\u002Fp>\n      <p style=\"margin: 0;\">Ты думаешь:<\u002Fp>\n      <p style=\"margin: 0; font-family: var(--font-heading); font-style: italic; font-size: 1.15em; color: var(--color-neutral-800);\">«Я строю команду».<\u002Fp>\n      <p style=\"margin: 0;\">А по факту:<\u002Fp>\n      <p style=\"margin: 0; font-family: var(--font-heading); font-style: italic; font-size: 1.15em; color: var(--color-neutral-800);\">«Я обслуживаю команду своим личным присутствием».<\u002Fp>\n      <p style=\"margin: 8px 0 0; font-weight: 600;\">Разница огромная.<\u002Fp>\n      <p style=\"margin: 0;\">Потому что пока ты рядом — всё работает.<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 6px 0 0 20px; border-left: 2px solid var(--color-neutral-300);\">\n        <p style=\"margin: 0;\">Ты устал — темп падает.<\u002Fp>\n        <p style=\"margin: 0;\">Ты заболел — команда ждёт.<\u002Fp>\n        <p style=\"margin: 0;\">Ты уехал — активность просела.<\u002Fp>\n        <p style=\"margin: 0;\">Ты перестал писать — никто не пишет.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 8px 0 0;\">И тогда начинается знакомое:<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; font-family: var(--font-heading); font-style: italic; font-size: 1.1em; color: var(--color-neutral-800);\">\n        <p style=\"margin: 0;\">«Люди не те».<\u002Fp>\n        <p style=\"margin: 0;\">«Никто не хочет работать».<\u002Fp>\n        <p style=\"margin: 0;\">«Сейчас очень тяжело приглашать».<\u002Fp>\n        <p style=\"margin: 0;\">«Люди ленивые».<\u002Fp>\n        <p style=\"margin: 0;\">«Надо больше мотивации».<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 12px 0 0; font-family: var(--font-heading); font-weight: 700; font-size: clamp(26px, 5vw, 40px); line-height: 1.1;\">Нет.<\u002Fp>\n      <p style=\"margin: 0;\">Возможно, дело вообще не в людях.<\u002Fp>\n    <\u002Fsection>\n\n    <section style=\"display: flex; flex-direction: column; gap: 18px; padding: 84px 0 0; font-size: clamp(17px, 2.3vw, 19px); line-height: 1.6;\">\n      <h2 style=\"margin: 0 0 10px; font-family: var(--font-heading); font-weight: 700; font-size: clamp(28px, 5.6vw, 46px); line-height: 1.06; letter-spacing: -0.015em; text-wrap: balance;\">ВОЗМОЖНО, ТЫ ПРОСТО ПОСТРОИЛ СИСТЕМУ, В КОТОРОЙ ТЫ САМ <span style=\"color: var(--color-accent-2)\">СТАЛ НЕЗАМЕНИМЫМ.<\u002Fspan><\u002Fh2>\n      <p style=\"margin: 0;\">И это звучит как комплимент.<\u002Fp>\n      <p style=\"margin: 0;\">Но для бизнеса — это проблема.<\u002Fp>\n      <p style=\"margin: 0;\">Потому что если без тебя ничего не происходит, у тебя не система.<\u002Fp>\n      <p style=\"margin: 0; font-weight: 600;\">У тебя ручное управление.<\u002Fp>\n      <h3 style=\"margin: 34px 0 6px; font-family: var(--font-heading); font-weight: 700; font-size: clamp(22px, 3.6vw, 30px); line-height: 1.14; letter-spacing: -0.01em;\">ПРОБЛЕМА ЗДЕСЬ НЕ В МОТИВАЦИИ<\u002Fh3>\n      <p style=\"margin: 0;\">Потому что ты уже знаешь, как мотивировать.<\u002Fp>\n      <p style=\"margin: 0;\">Наверняка знаешь больше, чем многие люди, которые сегодня продают обучение по сетевому.<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 16px; padding: 10px 0 0;\">\n        <div>\n          <p style=\"margin: 0;\">Тебе не нужен ещё один:<\u002Fp>\n          <p style=\"margin: 4px 0 0; font-family: var(--font-heading); font-style: italic; font-size: 1.15em; color: var(--color-neutral-800);\">«Как стать лидером».<\u002Fp>\n          <p style=\"margin: 4px 0 0; font-weight: 600;\">Ты уже лидер.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin: 0;\">Тебе не нужен:<\u002Fp>\n          <p style=\"margin: 4px 0 0; font-family: var(--font-heading); font-style: italic; font-size: 1.15em; color: var(--color-neutral-800);\">«Как приглашать людей».<\u002Fp>\n          <p style=\"margin: 4px 0 0; font-weight: 600;\">Ты это умеешь.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin: 0;\">Тебе не нужен:<\u002Fp>\n          <p style=\"margin: 4px 0 0; font-family: var(--font-heading); font-style: italic; font-size: 1.15em; color: var(--color-neutral-800);\">«Как работать с возражениями».<\u002Fp>\n          <p style=\"margin: 4px 0 0; font-weight: 600;\">Ты уже слышал их сотни.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin: 14px 0 0;\">Тебе нужен другой уровень.<\u002Fp>\n      <p style=\"margin: 0;\">Не научить себя работать.<\u002Fp>\n      <p style=\"margin: 0;\">А сделать так, чтобы другой человек мог повторить рабочий процесс без постоянного участия тебя.<\u002Fp>\n      <p style=\"margin: 0;\">Вот здесь начинается настоящая дубликация.<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 12px; padding: 26px 0 0;\">\n        <p style=\"margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: clamp(22px, 3.6vw, 30px); line-height: 1.14;\">НЕ «ДЕЛАЙ КАК Я»<\u002Fp>\n        <p style=\"margin: 0;\">А:<\u002Fp>\n        <p style=\"margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: clamp(22px, 3.6vw, 32px); line-height: 1.14; color: var(--color-accent-700);\">«ВОТ ПРОЦЕСС. ПРОЙДИ ЕГО САМ. ПОЛУЧИ ОПЫТ. ПЕРЕДАЙ ЕГО СЛЕДУЮЩЕМУ».<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 14px 0 0;\">Это совершенно другая логика.<\u002Fp>\n      <p style=\"margin: 0;\">Потому что тогда новый партнёр не становится ещё одним человеком, которого тебе нужно вести.<\u002Fp>\n      <p style=\"margin: 0;\">Он постепенно становится человеком, который сам умеет проходить процесс и передавать его дальше.<\u002Fp>\n      <p style=\"margin: 0;\">И именно эту проблему мы решали, когда собирали свою систему.<\u002Fp>\n    <\u002Fsection>\n\n    <section style=\"display: flex; flex-direction: column; gap: 18px; padding: 84px 0 0; font-size: clamp(17px, 2.3vw, 19px); line-height: 1.6;\">\n      <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n        <span style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-neutral-600);\">Механика дупликации · 01<\u002Fspan>\n        <h2 style=\"margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: clamp(28px, 5.6vw, 44px); line-height: 1.06; letter-spacing: -0.015em;\">«СТАРТ ПАРТНЁРА»<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin: 0; font-family: var(--font-heading); font-style: italic; font-size: 1.2em; color: var(--color-accent-2-700);\">Три дня.<\u002Fp>\n      <p style=\"margin: 0;\">Но не три дня:<\u002Fp>\n      <p style=\"margin: 0; font-family: var(--font-heading); font-style: italic; font-size: 1.1em; color: var(--color-neutral-800);\">«Вот компания. Вот продукт. Вот маркетинг-план. Теперь иди приглашай».<\u002Fp>\n      <p style=\"margin: 8px 0 0;\">Сначала человеку нужно изменить собственное представление о том, как вообще работает партнёрский бизнес.<\u002Fp>\n      <p style=\"margin: 0;\">Понять:<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 4px 0 0 20px; border-left: 2px solid var(--color-accent-200);\">\n        <p style=\"margin: 0;\">откуда появляется деньги;<\u002Fp>\n        <p style=\"margin: 0;\">что именно делает партнёр;<\u002Fp>\n        <p style=\"margin: 0;\">почему одни люди строят, а другие годами остаются на уровне покупателя;<\u002Fp>\n        <p style=\"margin: 0;\">как устроен путь от первого контакта до первого самостоятельного результата.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 8px 0 0;\">А уже потом — механика.<\u002Fp>\n      <p style=\"margin: 0;\">Потому что бессмысленно давать человеку десять инструментов, если он не понимает, что с ними делать и зачем.<\u002Fp>\n    <\u002Fsection>\n\n    <section style=\"display: flex; flex-direction: column; gap: 18px; padding: 72px 0 0; font-size: clamp(17px, 2.3vw, 19px); line-height: 1.6;\">\n      <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n        <span style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--color-neutral-600);\">Механика дупликации · 02<\u002Fspan>\n        <h2 style=\"margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: clamp(28px, 5.6vw, 44px); line-height: 1.06; letter-spacing: -0.015em;\">«ТОЧКА КАСАНИЯ»<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin: 0; font-weight: 600;\">Следующий уровень.<\u002Fp>\n      <p style=\"margin: 0;\">Не схема:<\u002Fp>\n      <p style=\"margin: 0; padding: 14px 18px; background: var(--color-neutral-200); font-family: var(--font-heading); font-size: 1.05em; line-height: 1.4;\">лидер → новичок → лидер снова объясняет новичку → лидер спасает новичка.<\u002Fp>\n      <p style=\"margin: 0;\">А:<\u002Fp>\n      <p style=\"margin: 0; padding: 14px 18px; background: var(--color-accent-100); font-family: var(--font-heading); font-weight: 600; font-size: 1.05em; line-height: 1.4; color: var(--color-accent-900);\">лидер → процесс → партнёр проходит процесс → партнёр передаёт процесс следующему.<\u002Fp>\n      <p style=\"margin: 8px 0 0;\">Так появляется возможность дубликации.<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n        <p style=\"margin: 0;\">Не за счёт твоей харизмы.<\u002Fp>\n        <p style=\"margin: 0;\">Не за счёт бесконечных созвонов.<\u002Fp>\n        <p style=\"margin: 0;\">Не за счёт того, что ты каждый вечер пишешь в чат:<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 0; font-family: var(--font-heading); font-style: italic; font-size: 1.15em; color: var(--color-neutral-800);\">«Команда, ну где ваша активность?»<\u002Fp>\n      <p style=\"margin: 0;\">А за счёт того, что человеку есть что повторить.<\u002Fp>\n    <\u002Fsection>\n\n    <section style=\"display: flex; flex-direction: column; gap: 18px; padding: 84px 0 0; font-size: clamp(17px, 2.3vw, 19px); line-height: 1.6;\">\n      <h2 style=\"margin: 0 0 10px; font-family: var(--font-heading); font-weight: 700; font-size: clamp(28px, 5.6vw, 46px); line-height: 1.06; letter-spacing: -0.015em; text-wrap: balance;\">И ТУТ ВОЗНИКАЕТ ВОПРОС: ЗАЧЕМ ДЛЯ ЭТОГО НОВАЯ КОМПАНИЯ?<\u002Fh2>\n      <p style=\"margin: 0; font-weight: 600;\">Вот это уже действительно правильный вопрос.<\u002Fp>\n      <p style=\"margin: 0;\">Потому что если проблема только в системе — ты можешь попытаться построить такую систему там, где находишься сейчас.<\u002Fp>\n      <p style=\"margin: 0;\">И, возможно, так и стоит сделать.<\u002Fp>\n      <p style=\"margin: 0;\">Я не буду убеждать тебя переходить только потому, что появилась новая компания.<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 6px 0 0 20px; border-left: 2px solid var(--color-neutral-300);\">\n        <p style=\"margin: 0;\">Если тебя полностью устраивает твоя компания...<\u002Fp>\n        <p style=\"margin: 0;\">Если команда растёт...<\u002Fp>\n        <p style=\"margin: 0;\">Если ты доволен экономикой...<\u002Fp>\n        <p style=\"margin: 0;\">Если твоя система уже дублицируется...<\u002Fp>\n        <p style=\"margin: 0;\">Если тебя устраивает рынок, на котором ты работаешь...<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 8px 0 0;\">тебе, возможно, вообще не нужен Longrich.<\u002Fp>\n      <p style=\"margin: 0; font-family: var(--font-heading); font-style: italic; font-size: 1.25em;\">Серьёзно.<\u002Fp>\n      <h2 style=\"margin: 34px 0 10px; font-family: var(--font-heading); font-weight: 700; font-size: clamp(28px, 5.6vw, 46px); line-height: 1.06; letter-spacing: -0.015em; text-wrap: balance;\">НО ЕСЛИ ТЫ УЖЕ ДОШЁЛ ДО ПОТОЛКА...<\u002Fh2>\n      <p style=\"margin: 0;\">Если ты понимаешь, что умеешь больше, чем сейчас реализуешь.<\u002Fp>\n      <p style=\"margin: 0;\">Если твой результат требует всё больше личного участия.<\u002Fp>\n      <p style=\"margin: 0;\">Если ты годами строишь, но каждый новый человек снова начинает зависеть от тебя.<\u002Fp>\n      <p style=\"margin: 0;\">Если ты уже устал быть одновременно:<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 8px; padding: 4px 0 0 20px; border-left: 2px solid var(--color-accent-2-200); font-family: var(--font-heading); font-size: 1.1em;\">\n        <p style=\"margin: 0;\">лидером,<\u002Fp>\n        <p style=\"margin: 0;\">наставником,<\u002Fp>\n        <p style=\"margin: 0;\">мотиватором,<\u002Fp>\n        <p style=\"margin: 0;\">оператором,<\u002Fp>\n        <p style=\"margin: 0;\">диспетчером,<\u002Fp>\n        <p style=\"margin: 0;\">службой поддержки<\u002Fp>\n        <p style=\"margin: 0;\">и человеком, который в очередной раз объясняет одно и то же...<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 8px 0 0;\">тогда появляется другой вопрос.<\u002Fp>\n      <p style=\"margin: 0; font-weight: 600;\">А что, если менять нужно не только систему работы?<\u002Fp>\n      <p style=\"margin: 0; font-family: var(--font-heading); font-style: italic; font-size: 1.2em; color: var(--color-accent-700);\">Что, если стоит посмотреть на само поле, на котором ты эту систему применяешь?<\u002Fp>\n    <\u002Fsection>\n\n    <section style=\"display: flex; flex-direction: column; gap: 18px; padding: 84px 0 0; font-size: clamp(17px, 2.3vw, 19px); line-height: 1.6;\">\n      <h2 style=\"margin: 0 0 10px; font-family: var(--font-heading); font-weight: 700; font-size: clamp(28px, 5.6vw, 46px); line-height: 1.06; letter-spacing: -0.015em; text-wrap: balance;\">ПОТОМУ ЧТО У СЕТЕВОГО ЕСТЬ СТРАННАЯ ОСОБЕННОСТЬ.<\u002Fh2>\n      <p style=\"margin: 0;\">Можно быть очень сильным игроком...<\u002Fp>\n      <p style=\"margin: 0;\">И всё равно оказаться в ситуации, когда следующий шаг стоит слишком дорого.<\u002Fp>\n      <p style=\"margin: 0; font-weight: 600;\">Почему?<\u002Fp>\n      <p style=\"margin: 0;\">Потому что рынок уже сформирован.<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n        <p style=\"margin: 0;\">Люди распределены.<\u002Fp>\n        <p style=\"margin: 0;\">Команды построены.<\u002Fp>\n        <p style=\"margin: 0;\">Лидеры известны.<\u002Fp>\n        <p style=\"margin: 0;\">У каждого уже есть свой наставник.<\u002Fp>\n        <p style=\"margin: 0;\">Своя компания.<\u002Fp>\n        <p style=\"margin: 0;\">Своя история.<\u002Fp>\n        <p style=\"margin: 0;\">Свои отношения.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 8px 0 0;\">И каждый новый человек — это не просто человек.<\u002Fp>\n      <p style=\"margin: 0;\">Это человек, которого нужно перевести из уже существующей системы в твою.<\u002Fp>\n      <p style=\"margin: 8px 0 0; font-weight: 600;\">А теперь представь другую ситуацию.<\u002Fp>\n      <p style=\"margin: 0;\">Компания только начинает формировать рынок в России.<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n        <p style=\"margin: 0;\">Не «рынок вообще».<\u002Fp>\n        <p style=\"margin: 0;\">Не весь MLM.<\u002Fp>\n        <p style=\"margin: 0;\">А рынок вокруг конкретной компании.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 8px 0 0;\">И он ещё не успел стать плотным.<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 8px; padding: 4px 0 0 20px; border-left: 2px solid var(--color-accent-200);\">\n        <p style=\"margin: 0;\">Лидеры ещё не заняли все позиции.<\u002Fp>\n        <p style=\"margin: 0;\">Команды ещё не сформированы.<\u002Fp>\n        <p style=\"margin: 0;\">Связи ещё не закрепились на годы.<\u002Fp>\n        <p style=\"margin: 0;\">Структура ещё пишется.<\u002Fp>\n      <\u002Fdiv>\n      <h3 style=\"margin: 30px 0 6px; font-family: var(--font-heading); font-weight: 700; font-size: clamp(22px, 3.6vw, 32px); line-height: 1.14; letter-spacing: -0.01em;\">И ВОТ ТУТ ОПЫТ НАЧИНАЕТ ИГРАТЬ ПО-ДРУГОМУ.<\u002Fh3>\n      <p style=\"margin: 0;\">Новичок приходит на такой рынок и думает:<\u002Fp>\n      <p style=\"margin: 0; font-family: var(--font-heading); font-style: italic; font-size: 1.15em; color: var(--color-neutral-800);\">«С чего начать?»<\u002Fp>\n      <p style=\"margin: 8px 0 0;\">Ты приходишь с другим багажом.<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n        <p style=\"margin: 0;\">Ты уже знаешь, что делать.<\u002Fp>\n        <p style=\"margin: 0;\">Ты уже знаешь, кого искать.<\u002Fp>\n        <p style=\"margin: 0;\">Ты уже понимаешь, что лидер — это не просто человек с хорошей речью.<\u002Fp>\n        <p style=\"margin: 0;\">Ты знаешь, почему команда не дублицируется.<\u002Fp>\n        <p style=\"margin: 0;\">Ты знаешь, где обычно ломается новичок.<\u002Fp>\n        <p style=\"margin: 0;\">Ты знаешь цену отсутствию системы.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 8px 0 0;\">Поэтому тебе не нужно начинать с нуля.<\u002Fp>\n      <p style=\"margin: 0; font-weight: 600;\">Тебе нужно перенести свой опыт на новое поле.<\u002Fp>\n    <\u002Fsection>\n\n    <section style=\"display: flex; flex-direction: column; gap: 18px; padding: 84px 0 0; font-size: clamp(17px, 2.3vw, 19px); line-height: 1.6;\">\n      <h2 style=\"margin: 0 0 10px; font-family: var(--font-heading); font-weight: 700; font-size: clamp(28px, 5.6vw, 46px); line-height: 1.06; letter-spacing: -0.015em; text-wrap: balance;\">ИМЕННО ПОЭТОМУ МЫ СМОТРИМ НА РОССИЮ СЕЙЧАС.<\u002Fh2>\n      <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n        <div>\n          <p style=\"margin: 0;\">Не потому что:<\u002Fp>\n          <p style=\"margin: 4px 0 0; font-family: var(--font-heading); font-style: italic; font-size: 1.15em; color: var(--color-neutral-800);\">«кто первый — тот всё заберёт».<\u002Fp>\n          <p style=\"margin: 4px 0 0; font-weight: 600;\">Это сказка.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin: 0;\">Не потому что:<\u002Fp>\n          <p style=\"margin: 4px 0 0; font-family: var(--font-heading); font-style: italic; font-size: 1.15em; color: var(--color-neutral-800);\">«рынок свободный, деньги лежат».<\u002Fp>\n          <p style=\"margin: 4px 0 0; font-weight: 600;\">Тоже сказка.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin: 0;\">И точно не потому что:<\u002Fp>\n          <p style=\"margin: 4px 0 0; font-family: var(--font-heading); font-style: italic; font-size: 1.15em; color: var(--color-neutral-800);\">«мы гарантируем тебе доход».<\u002Fp>\n          <p style=\"margin: 4px 0 0; font-weight: 600;\">Такого я тебе обещать не буду.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin: 14px 0 0;\">Ранний рынок ничего не гарантирует.<\u002Fp>\n      <p style=\"margin: 0;\">Он даёт другое.<\u002Fp>\n      <p style=\"margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: clamp(22px, 3.6vw, 30px); line-height: 1.14; color: var(--color-accent-700);\">Более раннюю позицию в формирующейся структуре.<\u002Fp>\n      <p style=\"margin: 0;\">А дальше всё равно придётся работать.<\u002Fp>\n    <\u002Fsection>\n\n    <section style=\"display: flex; flex-direction: column; gap: 18px; padding: 84px 0 0; font-size: clamp(17px, 2.3vw, 19px); line-height: 1.6;\">\n      <h2 style=\"margin: 0 0 10px; font-family: var(--font-heading); font-weight: 700; font-size: clamp(28px, 5.6vw, 46px); line-height: 1.06; letter-spacing: -0.015em;\">А САМА КОМПАНИЯ?<\u002Fh2>\n      <p style=\"margin: 0;\">И здесь я понимаю твой вопрос.<\u002Fp>\n      <p style=\"margin: 0;\">Потому что если ты уже был в сетевом не первый год, ты наверняка видел и такое:<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 4px 0 0 20px; border-left: 2px solid var(--color-neutral-300);\">\n        <p style=\"margin: 0;\">Компания красиво стартовала.<\u002Fp>\n        <p style=\"margin: 0;\">Все говорили о перспективах.<\u002Fp>\n        <p style=\"margin: 0;\">Лидеры собирали команды.<\u002Fp>\n        <p style=\"margin: 0;\">А потом что-то менялось.<\u002Fp>\n        <p style=\"margin: 0;\">Маркетинг-план.<\u002Fp>\n        <p style=\"margin: 0;\">Руководство.<\u002Fp>\n        <p style=\"margin: 0;\">Условия.<\u002Fp>\n        <p style=\"margin: 0;\">Или компания просто переставала существовать.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 8px 0 0;\">И после такого естественный вопрос:<\u002Fp>\n      <p style=\"margin: 0; font-family: var(--font-heading); font-style: italic; font-size: 1.15em; color: var(--color-neutral-800);\">«А с чего я должен верить, что через год здесь вообще всё будет?»<\u002Fp>\n      <p style=\"margin: 8px 0 0; font-family: var(--font-heading); font-weight: 700; font-size: clamp(26px, 5vw, 40px); line-height: 1.1;\">Не должен.<\u002Fp>\n      <p style=\"margin: 0;\">Поэтому не верь мне на слово.<\u002Fp>\n      <p style=\"margin: 0; font-weight: 600;\">Смотри на факты — и на то, что каждый из них реально значит для тебя.<\u002Fp>\n    <\u002Fsection>\n  <\u002Fdiv>\n\n  <div style=\"max-width: 1080px; margin: 0 auto; padding: 40px 22px 0;\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 34px 40px;\">\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <span style=\"font-family: var(--font-heading); font-weight: 700; font-size: clamp(46px, 9vw, 68px); line-height: 0.9; letter-spacing: -0.03em; color: var(--color-accent-700);\">1986<\u002Fspan>\n        <p style=\"margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: 20px; line-height: 1.2;\">год основания.<\u002Fp>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.55;\">Это не стартап, который открылся под волну хайпа и может так же тихо закрыться.<\u002Fp>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.55;\">Компании почти сорок лет — она пережила не один экономический цикл до того, как ты о ней вообще услышал.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <span style=\"font-family: var(--font-heading); font-weight: 700; font-size: clamp(46px, 9vw, 68px); line-height: 0.9; letter-spacing: -0.03em; color: var(--color-accent-700);\">138<\u002Fspan>\n        <p style=\"margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: 20px; line-height: 1.2;\">стран регистрации товарного знака.<\u002Fp>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.55;\">Юридически закрепить бренд в 138 странах — это не то, что делают, когда планируют исчезнуть через пару лет.<\u002Fp>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.55;\">Это дорогая, долгая история, в которую не входят ради красивой презентации.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <span style=\"font-family: var(--font-heading); font-weight: 700; font-size: clamp(46px, 9vw, 68px); line-height: 0.9; letter-spacing: -0.03em; color: var(--color-accent-700);\">8<\u002Fspan>\n        <p style=\"margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: 20px; line-height: 1.2;\">исследовательских центров — США, Япония, Франция, совместные лаборатории с университетами.<\u002Fp>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.55;\">Значит, у компании есть что защищать помимо твоих взносов: собственные разработки, патенты, репутация в странах, где за качеством следят жёстко.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <span style=\"font-family: var(--font-heading); font-weight: 700; font-size: clamp(26px, 4.4vw, 34px); line-height: 1.05; letter-spacing: -0.01em; color: var(--color-accent-700);\">ISO 9001, ISO 14001, ISO 22716, BRC, GMPC.<\u002Fspan>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.55;\">Это не значок для сайта.<\u002Fp>\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.55;\">Это сертификации, которые нужно ежегодно подтверждать через внешний аудит — и которые проваливают именно те компании-однодневки, о которых ты вспомнил в начале этого блока.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width: 760px; margin: 0 auto; padding: 0 22px;\">\n    <section style=\"display: flex; flex-direction: column; gap: 18px; padding: 56px 0 0; font-size: clamp(17px, 2.3vw, 19px); line-height: 1.6;\">\n      <p style=\"margin: 0;\">Полное досье — документы, история, производство, продукты →<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 17px;\">\n        <a href=\"https://www.longrich.com/en/about/history.php\" target=\"_blank\" rel=\"noopener\">longrich.com/en/about/history.php<\u002Fa>\n        <a href=\"https://en.wikipedia.org/wiki/Longrich\" target=\"_blank\" rel=\"noopener\">en.wikipedia.org/wiki/Longrich<\u002Fa>\n        <a href=\"https://t.me/+hv-J_5XV0NFiYTUy\" target=\"_blank\" rel=\"noopener\">Longrich dossier<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 8px; padding: 8px 0 0; font-family: var(--font-heading); font-weight: 700; font-size: clamp(20px, 3vw, 26px); line-height: 1.15;\">\n        <p style=\"margin: 0;\">Посмотри.<\u002Fp>\n        <p style=\"margin: 0;\">Проверь.<\u002Fp>\n        <p style=\"margin: 0;\">Задай неудобные вопросы.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 8px 0 0;\">Это не гарантия, что ты заработаешь — такую гарантию не даёт никто и нигде.<\u002Fp>\n      <p style=\"margin: 0;\">Это гарантия другого:<\u002Fp>\n      <p style=\"margin: 0; font-family: var(--font-heading); font-style: italic; font-size: 1.2em; color: var(--color-accent-700);\">тебе есть что проверить, а не только во что поверить.<\u002Fp>\n      <p style=\"margin: 8px 0 0;\">Если после этого компания тебе не подходит — значит, не подходит.<\u002Fp>\n      <p style=\"margin: 0;\">Мне не нужно, чтобы ты закрывал на что-то глаза.<\u002Fp>\n    <\u002Fsection>\n\n    <section style=\"display: flex; flex-direction: column; gap: 18px; padding: 96px 0 0; font-size: clamp(17px, 2.3vw, 19px); line-height: 1.6;\">\n      <h2 style=\"margin: 0 0 10px; font-family: var(--font-heading); font-weight: 700; font-size: clamp(30px, 6.4vw, 52px); line-height: 1.04; letter-spacing: -0.02em;\">ЧТО ТЫ ПОЛУЧАЕШЬ<\u002Fh2>\n      <p style=\"margin: 0;\">Не «волшебную кнопку».<\u002Fp>\n      <p style=\"margin: 0;\">Не наставника, который будет каждое утро спрашивать:<\u002Fp>\n      <p style=\"margin: 0; font-family: var(--font-heading); font-style: italic; font-size: 1.15em; color: var(--color-neutral-800);\">«Ну что, сколько людей сегодня написал?»<\u002Fp>\n      <p style=\"margin: 0;\">И не человека, который будет годами тащить твою команду.<\u002Fp>\n      <p style=\"margin: 8px 0 0; font-weight: 600;\">Наоборот.<\u002Fp>\n      <p style=\"margin: 0;\">Ты получаешь инструменты.<\u002Fp>\n      <p style=\"margin: 0;\">И дальше работаешь сам.<\u002Fp>\n    <\u002Fsection>\n  <\u002Fdiv>\n\n  <div style=\"max-width: 900px; margin: 0 auto; padding: 44px 22px 0;\">\n    <div style=\"display: flex; flex-direction: column; gap: 44px;\">\n      <div style=\"display: grid; grid-template-columns: minmax(0, 64px) minmax(0, 1fr); gap: 10px 24px; align-items: start;\">\n        <span style=\"font-family: var(--font-heading); font-weight: 700; font-size: clamp(30px, 5vw, 40px); line-height: 0.95; color: var(--color-accent-2-700);\">01<\u002Fspan>\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <h3 style=\"margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: clamp(22px, 3.4vw, 30px); line-height: 1.12;\">ГОТОВЫЙ СТАРТ<\u002Fh3>\n          <p style=\"margin: 0; font-size: 17px; line-height: 1.6;\">Понятный маршрут первых дней.<\u002Fp>\n          <p style=\"margin: 0; font-size: 17px; line-height: 1.6;\">Чтобы не тратить время на изобретение собственного onboarding с нуля.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: minmax(0, 64px) minmax(0, 1fr); gap: 10px 24px; align-items: start;\">\n        <span style=\"font-family: var(--font-heading); font-weight: 700; font-size: clamp(30px, 5vw, 40px); line-height: 0.95; color: var(--color-accent-2-700);\">02<\u002Fspan>\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <h3 style=\"margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: clamp(22px, 3.4vw, 30px); line-height: 1.12;\">«СТАРТ ПАРТНЁРА»<\u002Fh3>\n          <p style=\"margin: 0; font-size: 17px; line-height: 1.6;\">Система первых трёх дней, которая сначала формирует понимание модели, а потом переводит человека к действиям.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: minmax(0, 64px) minmax(0, 1fr); gap: 10px 24px; align-items: start;\">\n        <span style=\"font-family: var(--font-heading); font-weight: 700; font-size: clamp(30px, 5vw, 40px); line-height: 0.95; color: var(--color-accent-2-700);\">03<\u002Fspan>\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <h3 style=\"margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: clamp(22px, 3.4vw, 30px); line-height: 1.12;\">«ТОЧКА КАСАНИЯ»<\u002Fh3>\n          <p style=\"margin: 0; font-size: 17px; line-height: 1.6;\">Логика дубликации:<\u002Fp>\n          <p style=\"margin: 0; font-family: var(--font-heading); font-weight: 600; font-size: 19px; line-height: 1.4; color: var(--color-accent-900);\">сам прошёл → понял → повторил → передал следующему.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: minmax(0, 64px) minmax(0, 1fr); gap: 10px 24px; align-items: start;\">\n        <span style=\"font-family: var(--font-heading); font-weight: 700; font-size: clamp(30px, 5vw, 40px); line-height: 0.95; color: var(--color-accent-2-700);\">04<\u002Fspan>\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <h3 style=\"margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: clamp(22px, 3.4vw, 30px); line-height: 1.12;\">ГОТОВЫЕ МАТЕРИАЛЫ<\u002Fh3>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 17px;\">\n            <span>Компания.<\u002Fspan>\n            <span>Продукты.<\u002Fspan>\n            <span>Модель.<\u002Fspan>\n            <span>Обучение.<\u002Fspan>\n            <span>Контент.<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin: 0; font-size: 17px; line-height: 1.6;\">Не нужно собирать всё по кусочкам из десяти чатов.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: minmax(0, 64px) minmax(0, 1fr); gap: 10px 24px; align-items: start;\">\n        <span style=\"font-family: var(--font-heading); font-weight: 700; font-size: clamp(30px, 5vw, 40px); line-height: 0.95; color: var(--color-accent-2-700);\">05<\u002Fspan>\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <h3 style=\"margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: clamp(22px, 3.4vw, 30px); line-height: 1.12;\">РЕАЛЬНЫЙ ОПЫТ КАЗАХСТАНА<\u002Fh3>\n          <p style=\"margin: 0; font-size: 17px; line-height: 1.6;\">Не презентация о том, как «когда-нибудь всё будет».<\u002Fp>\n          <p style=\"margin: 0; font-size: 17px; line-height: 1.6;\">А то, что уже произошло на работающем рынке.<\u002Fp>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 17px;\">\n            <span>Результаты.<\u002Fspan>\n            <span>Команды.<\u002Fspan>\n            <span>Процессы.<\u002Fspan>\n            <span>Опыт.<\u002Fspan>\n            <span>Ошибки.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width: 760px; margin: 0 auto; padding: 0 22px;\">\n    <section style=\"display: flex; flex-direction: column; gap: 18px; padding: 96px 0 0; font-size: clamp(17px, 2.3vw, 19px); line-height: 1.6;\">\n      <h2 style=\"margin: 0 0 10px; font-family: var(--font-heading); font-weight: 700; font-size: clamp(28px, 5.6vw, 46px); line-height: 1.06; letter-spacing: -0.015em; text-wrap: balance;\">И ЗДЕСЬ Я ХОЧУ СКАЗАТЬ САМОЕ ВАЖНОЕ.<\u002Fh2>\n      <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n        <p style=\"margin: 0;\">Я не ищу людей, которых нужно спасать.<\u002Fp>\n        <p style=\"margin: 0;\">Не ищу тех, кому надо ежедневно объяснять, почему нужно работать.<\u002Fp>\n        <p style=\"margin: 0;\">Не ищу тех, кто хочет «попробовать».<\u002Fp>\n        <p style=\"margin: 0;\">Не ищу людей, которые ждут, что лидер построит им бизнес.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 8px 0 0; font-weight: 600;\">Мне нужны люди, которые уже умеют работать.<\u002Fp>\n      <p style=\"margin: 0;\">Которые понимают:<\u002Fp>\n      <p style=\"margin: 0; font-family: var(--font-heading); font-style: italic; font-size: 1.15em; color: var(--color-neutral-800);\">результат не появляется от одной регистрации.<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n        <p style=\"margin: 0;\">Которые умеют принимать решения.<\u002Fp>\n        <p style=\"margin: 0;\">Которые способны самостоятельно использовать инструменты.<\u002Fp>\n        <p style=\"margin: 0;\">Которые не ждут, пока их будут мотивировать.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n\n  <div style=\"margin: 72px 0 0; background: var(--color-neutral-900); color: var(--color-neutral-100);\">\n    <div style=\"max-width: 760px; margin: 0 auto; padding: 64px 22px 72px; display: flex; flex-direction: column; gap: 20px; font-size: clamp(17px, 2.3vw, 19px); line-height: 1.6;\">\n      <span style=\"font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-accent-2-300);\">Фильтр<\u002Fspan>\n      <h2 style=\"margin: 0 0 6px; font-family: var(--font-heading); font-weight: 700; font-size: clamp(28px, 5.6vw, 46px); line-height: 1.06; letter-spacing: -0.015em; color: #ffffff; text-wrap: balance;\">ПОЭТОМУ ЗДЕСЬ ЕСТЬ АНТИСЕЙЛ.<\u002Fh2>\n      <p style=\"margin: 0;\">Если тебе нужен человек, который будет:<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 4px 0 0 20px; border-left: 2px solid var(--color-accent-2-500);\">\n        <p style=\"margin: 0;\">— каждый день тебя контролировать;<\u002Fp>\n        <p style=\"margin: 0;\">— заставлять писать людям;<\u002Fp>\n        <p style=\"margin: 0;\">— напоминать о задачах;<\u002Fp>\n        <p style=\"margin: 0;\">— вытаскивать тебя из каждого провала;<\u002Fp>\n        <p style=\"margin: 0;\">— строить твою команду вместо тебя —<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 18px 0 0; font-family: var(--font-heading); font-weight: 700; font-size: clamp(34px, 8vw, 62px); line-height: 1.0; letter-spacing: -0.02em; color: var(--color-accent-2-400);\">НЕ ПИШИ МНЕ.<\u002Fp>\n      <p style=\"margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: clamp(22px, 3.6vw, 30px); line-height: 1.14; color: #ffffff;\">ЗДЕСЬ НЕ СТРОЯТ БИЗНЕС ЗА ТЕБЯ.<\u002Fp>\n      <p style=\"margin: 0;\">(мы дадим систему, но результат за тебя делать не будем)<\u002Fp>\n      <p style=\"margin: 0;\">И это нормально.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width: 760px; margin: 0 auto; padding: 0 22px;\">\n    <section style=\"display: flex; flex-direction: column; gap: 18px; padding: 88px 0 0; font-size: clamp(17px, 2.3vw, 19px); line-height: 1.6;\">\n      <h2 style=\"margin: 0 0 10px; font-family: var(--font-heading); font-weight: 700; font-size: clamp(28px, 5.6vw, 46px); line-height: 1.06; letter-spacing: -0.015em;\">НО ЕСЛИ ТЫ УЖЕ УМЕЕШЬ...<\u002Fh2>\n      <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n        <p style=\"margin: 0;\">Если ты уже строил команду.<\u002Fp>\n        <p style=\"margin: 0;\">Если ты понимаешь, что такое дубликация.<\u002Fp>\n        <p style=\"margin: 0;\">Если у тебя есть опыт, но тебе надоело быть мотором каждого процесса.<\u002Fp>\n        <p style=\"margin: 0;\">Если ты не хочешь снова становиться новичком.<\u002Fp>\n        <p style=\"margin: 0;\">Если тебе интересен рынок, который только начинает формироваться.<\u002Fp>\n        <p style=\"margin: 0;\">И если тебе нужна не нянька, а среда + инструменты + система, которыми можно пользоваться самостоятельно...<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 8px 0 0; font-family: var(--font-heading); font-style: italic; font-size: 1.25em; color: var(--color-accent-700);\">тогда нам есть о чём поговорить.<\u002Fp>\n      <h3 style=\"margin: 34px 0 6px; font-family: var(--font-heading); font-weight: 700; font-size: clamp(22px, 3.6vw, 32px); line-height: 1.14; letter-spacing: -0.01em;\">И Я НЕ БУДУ ПРОСИТЬ ТЕБЯ СРАЗУ РЕГИСТРИРОВАТЬСЯ.<\u002Fh3>\n      <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n        <p style=\"margin: 0;\">Сначала посмотри.<\u002Fp>\n        <p style=\"margin: 0;\">Задай вопросы.<\u002Fp>\n        <p style=\"margin: 0;\">Попроси документы.<\u002Fp>\n        <p style=\"margin: 0;\">Посмотри на компанию.<\u002Fp>\n        <p style=\"margin: 0;\">Посмотри на продукты.<\u002Fp>\n        <p style=\"margin: 0;\">Посмотри на маркетинг-план.<\u002Fp>\n        <p style=\"margin: 0;\">Посмотри на реальные результаты в Казахстане.<\u002Fp>\n        <p style=\"margin: 0;\">Посмотри, что именно мы уже сделали.<\u002Fp>\n        <p style=\"margin: 0;\">Посмотри, как устроена система.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin: 8px 0 0;\">А потом сравни с тем, что у тебя есть сейчас.<\u002Fp>\n      <h3 style=\"margin: 34px 0 6px; font-family: var(--font-heading); font-weight: 700; font-size: clamp(22px, 3.6vw, 32px); line-height: 1.14; letter-spacing: -0.01em;\">ПОТОМУ ЧТО ВОПРОС НЕ:<\u002Fh3>\n      <p style=\"margin: 0; font-family: var(--font-heading); font-style: italic; font-size: 1.15em; color: var(--color-neutral-800);\">«Хорошая ли это новая компания?»<\u002Fp>\n      <p style=\"margin: 0;\">Вопрос другой:<\u002Fp>\n      <p style=\"margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: clamp(20px, 3.2vw, 28px); line-height: 1.2; color: var(--color-accent-700);\">«Имеет ли смысл мои уже накопленные навыки применить на новом рынке — и сделать это не с нуля, а с готовой системой?»<\u002Fp>\n      <p style=\"margin: 8px 0 0;\">Если ответ для тебя — да.<\u002Fp>\n      <p style=\"margin: 0; font-weight: 600;\">Тогда посмотрим дальше.<\u002Fp>\n    <\u002Fsection>\n  <\u002Fdiv>\n\n  <div style=\"margin: 96px 0 0; background: var(--color-accent-2-700); color: #ffffff;\">\n    <div style=\"max-width: 760px; margin: 0 auto; padding: 76px 22px 96px; display: flex; flex-direction: column; gap: 22px; font-size: clamp(17px, 2.3vw, 19px); line-height: 1.6;\">\n      <p style=\"margin: 0; font-family: var(--font-heading); font-weight: 700; font-size: clamp(56px, 17vw, 140px); line-height: 0.86; letter-spacing: -0.035em;\">РОССИЯ<\u002Fp>\n      <a href=\"{{ ctaLink }}\" style=\"display: inline-flex; align-items: center; justify-content: center; align-self: flex-start; min-height: 64px; margin: 10px 0 6px; padding: 20px 40px; background: #ffffff; border: 0; border-bottom: 0; color: var(--color-accent-2-800); font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: clamp(18px, 3vw, 22px); letter-spacing: 0.01em; text-decoration: none;\" style-hover=\"background: var(--color-accent-2-100); color: var(--color-accent-2-900);\" style-focus=\"outline: 3px solid #ffffff; outline-offset: 3px;\">Напиши мне «РОССИЯ»<\u002Fa>\n      <p style=\"margin: 0;\">Я покажу:<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; padding: 2px 0 0 20px; border-left: 2px solid rgba(255,255,255,0.5);\">\n        <p style=\"margin: 0;\">что сейчас открывается;<\u002Fp>\n        <p style=\"margin: 0;\">как устроена модель;<\u002Fp>\n        <p style=\"margin: 0;\">что уже готово;<\u002Fp>\n        <p style=\"margin: 0;\">какие инструменты ты получишь;<\u002Fp>\n        <p style=\"margin: 0;\">какие реальные результаты есть в Казахстане;<\u002Fp>\n        <p style=\"margin: 0;\">и почему я вообще считаю этот момент интересным для опытного сетевика.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 8px; padding: 14px 0 0;\">\n        <p style=\"margin: 0;\">Без искусственного дефицита.<\u002Fp>\n        <p style=\"margin: 0;\">Без «успей, пока не поздно».<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 8px; padding: 10px 0 0; font-family: var(--font-heading); font-weight: 700; font-size: clamp(24px, 4.4vw, 36px); line-height: 1.1;\">\n        <p style=\"margin: 0;\">Сначала посмотри.<\u002Fp>\n        <p style=\"margin: 0;\">Потом реши.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width: 760px; margin: 0 auto; padding: 40px 22px 56px; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-neutral-600);\">Longrich · Россия · Первая волна<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;ctaLink&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://t.me/BLesing78&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;CTA&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const block = e => { e.preventDefault(); return false; };\n    this._off = [];\n    for (const ev of [\"copy\", \"cut\", \"contextmenu\", \"selectstart\", \"dragstart\"]) {\n      document.addEventListener(ev, block);\n      this._off.push(() => document.removeEventListener(ev, block));\n    }\n    const keys = e => {\n      const k = (e.key || \"\").toLowerCase();\n      if ((e.ctrlKey || e.metaKey) && [\"c\", \"x\", \"a\", \"s\", \"p\", \"u\"].includes(k)) block(e);\n    };\n    document.addEventListener(\"keydown\", keys);\n    this._off.push(() => document.removeEventListener(\"keydown\", keys));\n  }\n  componentWillUnmount() { (this._off || []).forEach(f => f()); }\n\n  renderVals() {\n    return { ctaLink: this.props.ctaLink || \"https://t.me/BLesing78\" };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
